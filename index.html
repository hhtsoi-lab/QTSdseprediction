function toNumber(t) {
  if (t === null || t === undefined) return null;
  const s = String(t).trim().replace(/[,，]/g, "");
  if (s === "") return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function sortedCutoffs(cutoffs, levels) {
  return levels.map(l => [l, cutoffs[l]]).filter(p => p[1] !== null && p[1] !== undefined)
    .sort((a, b) => b[1] - a[1]);
}

function predict(score, full, cutoffs, subject) {
  const levels = levelsOf(subject);
  const pairs = sortedCutoffs(cutoffs, levels);
  const out = {score, full, percent: null, level: null, badge: "－", label: "", note: "", gap: null, gapTo: null, error: ""};
  if (score === null) { out.note = "請輸入分數"; return out; }
  if (full && score > full) { out.error = "分數不可超過滿分 " + fmt(full) + " 分"; return out; }
  if (score < 0) { out.error = "分數不可為負數"; return out; }
  if (full) out.percent = score / full * 100;
  if (!pairs.length) { out.note = "老師尚未輸入 cut off"; return out; }

  const idx = pairs.findIndex(p => score >= p[1]);
  if (idx === -1) {
    const [lowLevel, lowCut] = pairs[pairs.length - 1];
    const fk = failOf(subject);
    out.level = fk; out.badge = badgeOf(subject, fk); out.label = labelOf(subject, fk);
    out.gap = Math.ceil(lowCut - score); out.gapTo = lowLevel;
    out.note = "未達 " + labelOf(subject, lowLevel) + "（" + fmt(lowCut) + " 分），仲差 " + out.gap + " 分";
  } else {
    const [level, cut] = pairs[idx];
    out.level = level; out.badge = badgeOf(subject, level); out.label = labelOf(subject, level);
    out.note = fmt(cut) + " 分或以上";
    if (idx > 0) { out.gap = Math.ceil(pairs[idx - 1][1] - score); out.gapTo = pairs[idx - 1][0]; }

    if (ok) out[level] = Math.floor(total * 100) / 100;   // 向下取準，同 core.py 一致

    if (cap === "lower_plus1") allowed = Math.max(0, allowed - 1);
    if (rankOf(level) < allowed) {
      const original = labelOf(s, level);
      const cl = allowed < pairs.length ? pairs[allowed][0] : failOf(s);
      capped = "總分已達 " + original + "，但按規則「" + CAP_LABEL[cap] + "」最終以 " + labelOf(s, cl) + " 計算";
      level = cl; badge = badgeOf(s, cl); label = labelOf(s, cl); note = "受較低嘅一卷限制"; gap = null; gapTo = null;
    }
  }

  const lift = [];
  if (!capped) {
    const rank = rankOf(level);
    if (rank && pairs.length) {
      const target = pairs[Math.min(rank, pairs.length) - 1];
      const need = target[1] - total.value;
      if (need > 0) {
        gap = Math.ceil(need); gapTo = target[0];
        if (cap === "none") lift.push(...liftAdvice(need, s, scores));
      }
    }
  }
  return {enabled: true, total: total.value, full: view.full, level, badge, label, note, gap, gapTo, lift, capped, bottleneck, source: view.source};
}

function subjectReady(s) {
  const levels = levelsOf(s);
  return s.papers.every(p => levels.every(l => p.cutoffs[l] !== null && p.cutoffs[l] !== undefined))
    && s.papers.every(p => p.full_mark > 0) && !s.papers.some(p => !p.cutoffs[levels[0]] && p.cutoffs[levels[0]] !== 0);
}

let current = null;

function renderTabs() {
  const box = document.getElementById("tabs");
  box.innerHTML = "";
  for (const s of DATA.subjects) {
    const el = document.createElement("div");
    const ready = subjectReady(s);
    el.className = "tab" + (s.id === current.id ? " on" : "") + (ready ? "" : " off");
    el.innerHTML = s.name + (ready ? "" : '<span class="tag">未填</span>');
    if (ready) el.onclick = () => selectSubject(s.id);
    box.appendChild(el);
  }
}

function renderInputs() {
  const s = current;
  document.getElementById("subjectTitle").textContent = s.name + "｜" + s.papers.length + " 份卷";
  const box = document.getElementById("inputs");
  box.innerHTML = "";
  s.papers.forEach((p, i) => {
    const div = document.createElement("div");
    div.innerHTML = '<label for="in' + i + '">' + p.name + "（滿分 " + fmt(p.full_mark) + "）</label>"
      + '<input type="number" inputmode="decimal" step="0.5" min="0" max="' + p.full_mark + '" id="in' + i + '">'
      + '<div class="hint" style="margin-top:4px">' + labelOf(s, "3") + " 約 " + fmt(p.cutoffs["3"] ?? p.cutoffs["pass"]) + " 分</div>";
    box.appendChild(div);
    div.querySelector("input").addEventListener("input", paint);
  });
}

function renderTable() {
  const s = current;
  const view = overallView(s);
  const levels = levelsOf(s);
  let head = "<tr><th>級別</th>";
  for (const p of s.papers) head += "<th>" + p.name + "<br><span class='hint'>滿分 " + fmt(p.full_mark) + "</span></th>";
  if (view.enabled) head += "<th>整體<br><span class='hint'>滿分 " + fmt(view.full) + "</span></th>";
  head += "</tr>";

  let rows = "";
  levels.forEach((level, i) => {
    let cells = "<td>" + (i === 0 ? "★ " : "") + labelOf(s, level) + "</td>";
    for (const p of s.papers) cells += "<td>" + fmt(p.cutoffs[level]) + "</td>";
    if (view.enabled) cells += "<td>" + fmt(view.cutoffs[level]) + "</td>";
    rows += "<tr>" + cells + "</tr>";
  });
  const lowest = levels[levels.length - 1];
  let failCells = "<td>" + labelOf(s, failOf(s)) + "</td>";
  for (const p of s.papers) failCells += "<td>低於 " + fmt(p.cutoffs[lowest]) + "</td>";
  if (view.enabled) failCells += "<td>低於 " + fmt(view.cutoffs[lowest]) + "</td>";
  rows += "<tr>" + failCells + "</tr>";

  let fullCells = "<td>滿分</td>";
  for (const p of s.papers) fullCells += "<td>" + fmt(p.full_mark) + "</td>";
  if (view.enabled) fullCells += "<td>" + fmt(view.full) + "</td>";
  rows += "<tr>" + fullCells + "</tr>";

  document.getElementById("table").innerHTML = "<table><thead>" + head + "</thead><tbody>" + rows + "</tbody></table>";
  document.getElementById("methodNote").textContent = view.enabled
    ? "整體：" + view.source + "。低於 " + labelOf(s, lowest) + " 即屬 " + labelOf(s, failOf(s)) + "。"
    : view.source + "。";
}

function paint() {
  const s = current;
  const scores = {};
  const box = document.getElementById("cards");
  box.innerHTML = "";
  s.papers.forEach((p, i) => {
    const raw = document.getElementById("in" + i).value;
    const score = toNumber(raw);
    scores[p.id] = score;
    const r = predict(score, p.full_mark, p.cutoffs, s);
    if (raw.trim() && score === null) r.error = "請輸入有效嘅數字";

    const card = document.createElement("div");
    card.className = "card level-card";
    const c = r.error ? colorOf("none") : (r.level ? colorOf(r.level) : colorOf("none"));
    let detail;
    if (r.error) detail = p.name + "｜" + r.error;
    else if (!r.level) detail = p.name + "｜" + (r.note || "請輸入分數");
    else {
      let html = "<b>" + p.name + "｜" + fmt(r.score) + " / " + fmt(r.full) + " 分</b><br>";
      if (r.percent !== null) html += "得分率 " + r.percent.toFixed(1) + "%｜" + r.label + "（" + r.note + "）<br>";
      if (r.gap) html += (r.level === failOf(s) ? "加多 " + r.gap + " 分先合格，繼續努力！" : "再進步 " + r.gap + " 分 → " + labelOf(s, r.gapTo));
      else html += "已經係最高級別，繼續保持！";
      detail = html;
    }
    card.innerHTML = '<span class="badge" style="background:' + c[0] + ';color:' + c[1] + '">'
      + (r.error ? "?" : (r.badge || "－")) + "</span><div class='detail'>" + detail + "</div>";
    box.appendChild(card);
  });

  const ov = computeOverall(s, scores);
  const badge = document.getElementById("ovBadge"), detail = document.getElementById("ovDetail");
  if (!ov.enabled || !ov.level) {
    badge.textContent = ov.error ? "?" : "－";
    badge.style.background = ov.error ? colorOf("none")[0] : "#e2e8f0";
    badge.style.color = ov.error ? colorOf("none")[1] : "#33415c";
    detail.textContent = ov.error || ov.note || "請輸入全部卷數嘅分數";
    return;
  }
  const c = colorOf(ov.level);
  badge.textContent = ov.badge; badge.style.background = c[0]; badge.style.color = c[1];
  let html = "<b>總分 " + ov.total.toFixed(1) + " / " + fmt(ov.full) + "　→　" + ov.label + "</b>（" + ov.note + "）<br>" + ov.source + "<br>";
  if (ov.bottleneck) html += ov.bottleneck + "<br>";
  if (ov.capped) html += '<span style="color:#991b1b">' + ov.capped + "</span><br>";
  else if (ov.lift.length) html += "想升一級（只提升其中一卷）：" + ov.lift.join("；") + "<br>";
  else if (ov.level === failOf(s) && ov.gap) html += "總分加多 " + ov.gap + " 分先合格<br>";
  else if (ov.gap) html += "總分再進步 " + ov.gap + " 分 → " + labelOf(s, ov.gapTo) + "<br>";
  else html += "已達最高級別，繼續保持！<br>";
  detail.innerHTML = html;
}

function updateShare() {
  const params = new URLSearchParams();
  params.set("s", current.id);
  current.papers.forEach((p, i) => {
    const v = document.getElementById("in" + i).value;
    if (v) params.set("p" + (i + 1), v);
  });
  const url = location.origin + location.pathname + "?" + params.toString();
  document.getElementById("shareBox").value = (location.protocol === "file:") ? location.pathname + "?" + params.toString() : url;
}

function selectSubject(id) {
  current = DATA.subjects.find(s => s.id === id) || DATA.subjects[0];
  renderTabs();
  renderInputs();
  renderTable();
  paint();
  updateShare();
  history.replaceState(null, "", "?" + new URLSearchParams({s: id}).toString());
}

function resetAll() {
  current.papers.forEach((_p, i) => document.getElementById("in" + i).value = "");
  paint();
  updateShare();
}

document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const ready = DATA.subjects.filter(subjectReady);
  const wanted = params.get("s");
  const pool = ready.length ? ready : DATA.subjects;
  current = pool.find(s => s.id === wanted) || pool[0];

  document.getElementById("subhead").textContent = DATA.exam_name + "｜cut off 更新：" + (DATA.updated_at || "未記錄");
  document.getElementById("notice").innerHTML = ready.length
    ? '<div class="ok">★ ' + DATA.exam_name + "｜已準備好 " + ready.length + " 個科目</div>"
    : '<div class="warn">注意：未有任何科目填好 cut off，請老師先喺桌面版輸入並重新產生呢個檔案。</div>';

  renderTabs();
  renderInputs();
  renderTable();
  current.papers.forEach((p, i) => {
    const v = params.get("p" + (i + 1));
    if (v) document.getElementById("in" + i).value = v;
  });
  paint();
  updateShare();
});
</script>
